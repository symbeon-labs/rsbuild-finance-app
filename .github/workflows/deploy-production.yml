name: Verify Production Release

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "app/components/shell/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "styles/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    name: Validate code and confirm Vercel production release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and typecheck
        run: |
          npm test
          npm run typecheck

      - name: Validate Vercel verification credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_PROJECT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub secret $name is not configured."
              exit 1
            fi
          done

      - name: Confirm native Vercel Git deployment for this commit
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          API_URL="https://api.vercel.com/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=20"
          for attempt in $(seq 1 30); do
            RESPONSE="$(curl --silent --show-error --fail \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Accept: application/json" \
              "${API_URL}")"
            MATCH="$(printf '%s' "$RESPONSE" | jq -c --arg sha "$COMMIT_SHA" '
              [.deployments[]?
                | select(.meta.githubCommitSha == $sha and .target == "production")]
              | sort_by(.createdAt // .created // 0)
              | last // empty
            ')"
            if [[ -n "$MATCH" ]]; then
              STATE="$(printf '%s' "$MATCH" | jq -r '.readyState // .state // "UNKNOWN"')"
              URL="$(printf '%s' "$MATCH" | jq -r '.url // empty')"
              case "$STATE" in
                READY)
                  echo "Verified Vercel production deployment for $COMMIT_SHA: https://$URL"
                  {
                    echo "## RSBUILD Production Release Verified"
                    echo ""
                    echo "- Commit: `$COMMIT_SHA`"
                    echo "- Deployment: https://$URL"
                    echo "- Source: native Vercel Git integration"
                    echo "- Tests and typecheck: passed"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                ERROR|CANCELED|BLOCKED)
                  echo "::error::Vercel production deployment for $COMMIT_SHA finished with state $STATE."
                  exit 1
                  ;;
                *)
                  echo "Deployment found with state $STATE; waiting for READY (attempt $attempt/30)."
                  ;;
              esac
            else
              echo "Vercel has not registered a production deployment for $COMMIT_SHA yet (attempt $attempt/30)."
            fi
            sleep 10
          done
          echo "::error::No READY Vercel production deployment was found for commit $COMMIT_SHA within five minutes."
          exit 1
