name: Database Tests

on:
  pull_request:
    branches: [main, feat/finance-payables-foundation]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Pick unused host ports at runtime. Fixed alternate ports can also be
      # occupied by services preinstalled on GitHub-hosted runners.
      - name: Configure isolated Supabase database ports
        shell: bash
        run: |
          python3 <<'PY'
          import socket
          from pathlib import Path

          config = Path("supabase/config.toml")
          lines = config.read_text().splitlines()

          def free_port():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                  sock.bind(("127.0.0.1", 0))
                  return sock.getsockname()[1]

          db_port = free_port()
          shadow_port = free_port()
          while shadow_port == db_port:
              shadow_port = free_port()

          db_section = lines.index("[db]")
          if not lines[db_section + 1].startswith("port = "):
              raise SystemExit("Could not safely locate Supabase [db] port")
          lines[db_section + 1] = f"port = {db_port}"
          shadow_line = next((i for i, line in enumerate(lines) if line.startswith("shadow_port = ")), None)
          if shadow_line is None:
              raise SystemExit("Could not safely locate Supabase shadow_port")
          lines[shadow_line] = f"shadow_port = {shadow_port}"
          config.write_text("\n".join(lines) + "\n")
          print(f"Using Supabase db_port={db_port}, shadow_port={shadow_port}")
          PY
      - run: supabase start -x studio,edge-runtime,logflare,vector,inbucket
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
