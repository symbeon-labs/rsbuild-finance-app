name: Database Tests

on:
  pull_request:
    branches: [main, feat/finance-payables-foundation]
    paths:
      - "supabase/**"
      - ".github/workflows/database-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      # Pick unused host ports at runtime. Fixed alternate ports can also be
      # occupied by services preinstalled on GitHub-hosted runners.
      - name: Configure isolated Supabase database ports
        shell: bash
        run: |
          python3 <<'PY'
          import re
          import socket
          from pathlib import Path

          config = Path("supabase/config.toml")
          text = config.read_text()

          def free_port():
              with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                  sock.bind(("127.0.0.1", 0))
                  return sock.getsockname()[1]

          db_port = free_port()
          shadow_port = free_port()
          while shadow_port == db_port:
              shadow_port = free_port()

          text, db_count = re.subn(r"(?m)^port = \\d+$", f"port = {db_port}", text, count=1)
          text, shadow_count = re.subn(r"(?m)^shadow_port = \\d+$", f"shadow_port = {shadow_port}", text, count=1)
          if db_count != 1 or shadow_count != 1:
              raise SystemExit("Could not safely update Supabase port settings")
          config.write_text(text)
          print(f"Using Supabase db_port={db_port}, shadow_port={shadow_port}")
          PY
      - run: supabase start -x studio,edge-runtime,logflare,vector,inbucket
      - run: supabase test db
      - if: always()
        run: supabase stop --no-backup
